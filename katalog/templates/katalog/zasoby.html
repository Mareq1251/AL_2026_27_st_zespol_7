<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Katalog UniBook</title>
</head>
<body>
  <h1>Katalog zasobów UniBook</h1>

  <p>Zalogowano jako {{ request.user.username }}</p>
  <p><a href="{% url 'moje_rezerwacje' %}">Moje rezerwacje</a></p>

  <ul>
    {% for zasob in zasoby %}
      <li>
        {{ zasob.nazwa }} — {{ zasob.get_typ_display }}
        — {{ zasob.lokalizacja }}
        <a href="{% url 'nowa_rezerwacja' zasob.id %}">Rezerwuj</a>
      </li>
    {% empty %}
      <li>Brak aktywnych zasobów.</li>
    {% endfor %}
  </ul>
</body>
</html>
